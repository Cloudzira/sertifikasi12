<svg width="512" height="512" viewBox="-12 -12 144 144" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="-12" y="-12" width="144" height="144" rx="32" fill="#0b0f19"/>
  <defs>
    <linearGradient id="icg" gradientUnits="userSpaceOnUse" x1="22" y1="8" x2="98" y2="112">
      <stop offset="0" stop-color="rgb(116,126,223)"/>
      <stop offset="1" stop-color="rgb(38,178,160)"/>
    </linearGradient>
  </defs>

  <!-- heksagon solid -->
  <g class="lg-hex">
    <path d="M60 10 L103.3 35 L103.3 85 L60 110 L16.7 85 L16.7 35 Z"
          fill="url(#icg)" stroke="url(#icg)" stroke-width="8" stroke-linejoin="round"/>
    <!-- kilau bagian atas -->
    <path d="M60 6 L106.8 33 L106.8 52 C90 61 30 61 13.2 52 L13.2 33 Z" fill="#ffffff" fill-opacity="0.15"/>
  </g>

  <!-- garis bingkai dalam -->
  <path class="lg-ring" pathLength="1" d="M60 16 L98.1 38 L98.1 82 L60 104 L21.9 82 L21.9 38 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Al-Qur'an terbuka (putih solid) -->
  <g class="lg-book">
    <path d="M57 82 C50 75.5 40 73.5 29 76 L29 50 C40 47.5 50 49.5 57 56 Z
             M63 82 C70 75.5 80 73.5 91 76 L91 50 C80 47.5 70 49.5 63 56 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="url(#icg)" stroke-width="1.9" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M36 59 C41 58 46 59 51 61.5"/><path d="M36 66 C41 65 46 66 51 68.5"/>
      <path d="M84 59 C79 58 74 59 69 61.5"/><path d="M84 66 C79 65 74 66 69 68.5"/>
    </g>
    <path d="M44 91 H76" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M53 97.5 H67" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- bintang Rub el Hizb = simbol sertifikasi -->
  <g transform="translate(60 32)">
    <g class="lg-star-in">
      <rect x="-8" y="-8" width="16" height="16" rx="1.8" fill="#ffffff"/>
      <rect x="-8" y="-8" width="16" height="16" rx="1.8" fill="#ffffff" transform="rotate(45)"/>
      <circle r="3.7" fill="url(#icg)"/>
      <circle r="1.5" fill="#ffffff"/>
    </g>
  </g>
</svg>